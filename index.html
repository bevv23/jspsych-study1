<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Response Latencies Study 2</title>

<script src="https://unpkg.com/jspsych@8.2.2"></script>
<link href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" rel="stylesheet">

<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>

<style>
html, body { margin:0!important; padding:0!important; background:#fff!important; color:#000!important; font-family:Arial,sans-serif; }
.text-input { width:320px; padding:6px; border:1px solid #000; font-size:16px; }
.form-box { max-width:800px; margin:40px auto; text-align:left; color:#000; line-height:1.35; font-size:17px; border-top:1px solid #000; padding-top:24px; }
.form-title { text-align:center; font-weight:bold; font-size:28px; margin-bottom:28px; }
.question-title { font-weight:bold; margin-bottom:10px; }
</style>
</head>

<body></body>

<script>

function getUrlParam(param) {
  var urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}

var automatic_sona_id = getUrlParam("sona_id") || "";

var jsPsych = initJsPsych({
  on_finish: function () {

    function getSurveyValue(taskName, fieldName) {
      var row = jsPsych.data.get().filter({ task: taskName }).values()[0] || {};
      return row[fieldName] || "";
    }

    var payload = {
      automatic_sona_id: automatic_sona_id,
      sona_self_report_start: getSurveyValue("sona_id_start", "sona_self_report_start"),
      sona_self_report_end: getSurveyValue("sona_id_end", "sona_self_report_end")
    };

    console.log(payload);

  }
});

var timeline = [];

function parseSurveyResponse(data) {
  var response = data.response || {};
  Object.keys(response).forEach(function(key) {
    data[key] = response[key];
  });
}

timeline.push({
  type: jsPsychInstructions,
  pages: [`
    <div class="form-box">
      <div class="form-title">INSTRUCTIONS</div>
      <p>This is where your study instructions go.</p>
    </div>
  `],
  show_clickable_nav: true,
  allow_backward: false,
  show_page_number: false,
  button_label_next: "Continue"
});

timeline.push({
  type: jsPsychSurveyHtmlForm,
  data: { task: "sona_id_start" },
  html: `
    <div class="form-box">
      <div class="form-title">SONA IDENTITY CODE</div>

      <div class="question-block">
        <div class="question-title">
          Please re-enter your anonymous SONA identity code.
        </div>

        <input
          class="text-input"
          type="text"
          name="sona_self_report_start"
          required
        >
      </div>
    </div>
  `,
  button_label: "Continue",
  on_finish: parseSurveyResponse
});

timeline.push({
  type: jsPsychSurveyHtmlForm,
  data: { task: "sona_id_end" },
  html: `
    <div class="form-box">
      <div class="form-title">SONA IDENTITY CODE</div>

      <div class="question-block">
        <div class="question-title">
          Please re-enter your anonymous SONA identity code.
        </div>

        <input
          class="text-input"
          type="text"
          name="sona_self_report_end"
          required
        >
      </div>
    </div>
  `,
  button_label: "Submit",
  on_finish: parseSurveyResponse
});

jsPsych.run(timeline);

</script>
</html>
